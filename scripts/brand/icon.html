<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  body { width: 512px; height: 512px; display: grid; place-items: center; background: var(--wall); }
  .tile { position: relative; width: 512px; height: 512px; display: grid; place-items: center;
    background: radial-gradient(circle at 1.5px 1.5px, rgba(226,35,26,.5) 1.6px, transparent 2px) 0 0/16px 16px, var(--wall); }
  .burst { position: absolute; width: 470px; height: 470px; background: var(--yellow); }
  .burst.back { background: var(--ink); transform: translate(10px, 12px); }
  .a { position: relative; font-size: 380px; line-height: 1; color: var(--red); -webkit-text-stroke: 14px var(--ink); transform: rotate(-6deg) translateY(10px); }
</style>
<div class="tile"><div class="burst back"></div><div class="burst"></div><div class="a bangers">A</div></div>
<script>
  const pts = n => Array.from({ length: n * 2 }, (_, i) => { const r = i % 2 ? 41 : 50, a = (i / (n * 2)) * Math.PI * 2; return `${50 + Math.cos(a) * r}% ${50 + Math.sin(a) * r}%`; }).join(',');
  document.querySelectorAll('.burst').forEach(b => b.style.clipPath = `polygon(${pts(14)})`);
</script>
